[project]
name = "company-bi"
version = "0.1.0"
description = "Deterministic Polish NIP identity and bounded evidence-backed company research"
requires-python = ">=3.12"
dependencies = [
    "pydantic>=2.11,<3",
    "openpyxl>=3.1,<4",
    "pydantic-ai-slim[openai]>=2.54,<3",
    "tavily-python>=0.7,<1",
    "scrapling[fetchers]>=0.4,<1",
]

[project.scripts]
company-bi = "company_bi.cli:main"

[dependency-groups]
dev = [
    "mypy>=1.15,<2",
    "pytest>=8,<10",
    "pytest-asyncio>=1,<2",
    "ruff>=0.11,<1",
    "types-openpyxl>=3.1,<4",
]

[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.12"
strict = true
plugins = ["pydantic.mypy"]
