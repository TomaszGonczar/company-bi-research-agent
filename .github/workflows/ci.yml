name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      TAVILY_API_KEY: ""
      OPENAI_API_KEY: ""
      LOGFIRE_TOKEN: ""
    steps:
      - name: Isolate Codex state
        run: echo "CODEX_HOME=$RUNNER_TEMP/codex-home" >> "$GITHUB_ENV"
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@bec015b4c27a6fd13a6a1771b37a3cd9a3e1fcf1 # v10.1.0
        with:
          version: "0.12.3"
          enable-cache: true
          cache-dependency-glob: uv.lock
      - run: uv sync --frozen
      - run: uv run --frozen pytest -q
      - run: uv run --frozen ruff check .
      - run: uv run --frozen ruff format --check src tests
      - run: uv run --frozen mypy src
      - name: Run credential-free offline evaluation
        run: uv run --frozen company-bi eval --dataset examples/evals/dataset.json --output-dir "$RUNNER_TEMP/company-bi-eval"
